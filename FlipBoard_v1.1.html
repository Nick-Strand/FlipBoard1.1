<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Attitude – Split-Flap Board</title>
  <style>
    /* ============================================================
       CONFIGURATION: Edit CSS variables to customize look
       ============================================================ */
    :root {
      --board-bg:         #0d0d0d;
      --tile-bg:          #111111;
      --tile-border:      #222222;
      --letter-color:     #f0ece0;
      --letter-dim:       #2a2a2a;
      --header-text:      #ffffff;
      --accent-line:      #c8a84b;
      --tile-radius:      3px;
      --font-family:      'Courier New', 'Lucida Console', monospace;
      --header-font:      'Arial Black', 'Impact', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      margin: 0; padding: 0;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    /* Shell stretches to fill 100% of whatever DAKboard gives us */
    #board-shell {
      background: var(--board-bg);
      border-radius: 0px;
      box-shadow: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      flex: 1;
    }

    #board-header {
      text-align: center;
      font-family: var(--header-font);
      font-size: var(--header-font-size, 14px);
      letter-spacing: 0.35em;
      color: var(--header-text);
      text-transform: uppercase;
      width: 100%;
      user-select: none;
    }

    #board-header::after {
      content: '';
      display: block;
      margin: 5px auto 0;
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-line), transparent);
    }

    #board-grid {
      display: grid;
      /* grid-template-columns, gap set by JS */
    }

    .tile {
      /* width, height, font-size all set by JS via CSS vars */
      width:  var(--tile-w, 24px);
      height: var(--tile-h, 32px);
      background: var(--tile-bg);
      border: 1px solid var(--tile-border);
      border-radius: var(--tile-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      font-size: var(--tile-font, 14px);
      font-weight: bold;
      color: var(--letter-dim);
      position: relative;
      overflow: hidden;
      cursor: default;
      user-select: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.4);
    }

    /* Split-flap horizontal seam */
    .tile::after {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: rgba(0,0,0,0.65);
      z-index: 2;
      pointer-events: none;
    }

    /* Top-half sheen */
    .tile::before {
      content: '';
      position: absolute;
      inset: 0 0 50% 0;
      background: rgba(255,255,255,0.025);
      pointer-events: none;
      z-index: 1;
    }

    .tile span {
      position: relative;
      z-index: 3;
      line-height: 1;
    }

    .tile.active {
      color: var(--letter-color);
      text-shadow: 0 0 8px rgba(240,236,224,0.3);
    }

    .tile.flipping span {
      animation: flipChar 0.06s linear;
    }

    @keyframes flipChar {
      0%  { transform: scaleY(1);  opacity: 1;   }
      45% { transform: scaleY(0);  opacity: 0.3; }
      55% { transform: scaleY(0);  opacity: 0.3; }
      100%{ transform: scaleY(1);  opacity: 1;   }
    }

    #sound-toggle {
      position: absolute;
      top: 8px; right: 10px;
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #444;
      font-size: 13px;
      padding: 2px 5px;
      cursor: pointer;
      line-height: 1.4;
      transition: color 0.2s, border-color 0.2s;
      z-index: 10;
    }
    #sound-toggle:hover  { color: var(--accent-line); border-color: var(--accent-line); }
    #sound-toggle.muted  { opacity: 0.35; }

    #status-bar {
      text-align: center;
      font-family: var(--font-family);
      font-size: 10px;
      color: #333;
      min-height: 12px;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<div id="board-shell">
  <button id="sound-toggle" title="Toggle flip sound">🔊</button>
  <div id="board-header">CHOOSE YOUR ATTITUDE</div>
  <div id="board-grid"></div>
  <div id="status-bar"></div>
</div>

<script>
/* ================================================================
   CONFIGURATION
   ================================================================ */
const CONFIG = {
  GOOGLE_SHEET_CSV_URL: '',
  // Paste your published Google Sheet CSV URL above, e.g.:
  // 'https://docs.google.com/spreadsheets/d/e/YOUR_ID/pub?gid=0&single=true&output=csv'

  ROWS:    5,
  COLS:    30,

  ROTATION_MIN_SECS: 20,
  ROTATION_MAX_SECS: 30,

  SHUFFLE: true,   // true = random order; false = sequential

  TITLE: 'CHOOSE YOUR ATTITUDE',

  SOUND_ENABLED: true,

  // Animation
  FLIP_DURATION_MS:   60,
  FLIP_SCRAMBLE_REPS: 8,
  STAGGER_MS:         18,

  // Layout — fraction of viewport to use (0.0–1.0)
  // Adjust if you want the board smaller/larger inside its container
  FILL_W: 1.0,    // 100% of viewport width
  FILL_H: 1.0,    // 100% of viewport height
};

/* ================================================================
   FALLBACK QUOTES
   ================================================================ */
const FALLBACK_QUOTES = [
  { quote: "THE TRUTH DOESN'T MIND BEING QUESTIONED. BUT A LIE DOES.", author: '' },
  { quote: 'YOUR ATTITUDE IS THE ONE THING YOU CAN ALWAYS CONTROL.', author: 'NICK STRAND' },
  { quote: 'EVERY MORNING IS A CHANCE TO CHOOSE AGAIN.', author: '' },
  { quote: 'RESILIENCE IS NOT ABOUT BOUNCING BACK. IT IS ABOUT MOVING FORWARD.', author: 'NICK STRAND' },
  { quote: 'THE STAGE YOU BUILD FOR OTHERS IS THE ONE THAT DEFINES YOU.', author: '' },
  { quote: 'CONSISTENCY IS THE BRIDGE BETWEEN GOALS AND RESULTS.', author: '' },
  { quote: 'YOUR MINDSET IS YOUR MOST POWERFUL TOOL. SHARPEN IT DAILY.', author: '' },
  { quote: 'ATTITUDE IS A CHOICE. MAKE IT COUNT.', author: 'NICK STRAND' },
  { quote: 'HARD DAYS BUILD STRONG PEOPLE. LEAN IN.', author: '' },
  { quote: 'YOU CANNOT CONTROL THE STORM. BUT YOU CAN DECIDE TO DANCE IN THE RAIN.', author: '' },
];

const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@$%&*!?+-=<>';

/* ================================================================
   STATE
   ================================================================ */
let quotes       = [];
let quoteOrder   = [];      // shuffled/sequential index list
let orderPos     = 0;
let tiles        = [];
let rotationTimer = null;
let soundEnabled  = CONFIG.SOUND_ENABLED;
let audioCtx      = null;
let _masterComp   = null;
let isAnimating   = false;

/* ================================================================
   BOOT
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('board-header').textContent = CONFIG.TITLE;
  sizeBoard();
  buildGrid();
  setupSoundToggle();
  window.addEventListener('resize', () => { sizeBoard(); });
  loadQuotes().then(() => {
    buildOrder();
    showNextQuote();
    scheduleNext();
  });
});

/* ================================================================
   RESPONSIVE SIZING
   Calculates the largest tile size that fits the viewport given
   ROWS x COLS grid + header, then injects CSS variables.
   ================================================================ */
function sizeBoard() {
  // Use the actual container size (works inside DAKboard iframes too).
  // The shell is set to width:100% / height:100% in CSS so it always
  // matches whatever box DAKboard gives us.
  const shell = document.getElementById('board-shell');
  const grid  = document.getElementById('board-grid');
  const rows  = CONFIG.ROWS;
  const cols  = CONFIG.COLS;

  // Measure the real available box
  const vw = shell.clientWidth  || window.innerWidth;
  const vh = shell.clientHeight || window.innerHeight;

  const TILE_ASPECT = 1.35;  // tile height = tile width * TILE_ASPECT
  const GAP_RATIO   = 0.08;  // gap = tileW * GAP_RATIO

  // We solve for tileW such that the full grid + header fits in both
  // the width AND height of the container simultaneously.
  //
  // Width constraint:
  //   tileW * cols + gap * (cols-1) = vw
  //   tileW * cols + tileW * GAP_RATIO * (cols-1) = vw
  //   tileW * (cols + GAP_RATIO*(cols-1)) = vw
  const tileFromW = vw / (cols + GAP_RATIO * (cols - 1));

  // Height constraint:
  //   headerH + gridH = vh
  //   headerH ~ tileW * 1.6  (scales with tile)
  //   gridH   = tileH * rows + gap * (rows-1)
  //           = tileW * TILE_ASPECT * rows + tileW * GAP_RATIO * (rows-1)
  //           = tileW * (TILE_ASPECT*rows + GAP_RATIO*(rows-1))
  //   So: tileW * (1.6 + TILE_ASPECT*rows + GAP_RATIO*(rows-1)) = vh
  const HEADER_RATIO = 1.6;
  const tileFromH = vh / (HEADER_RATIO + TILE_ASPECT * rows + GAP_RATIO * (rows - 1));

  // Pick whichever is tighter so nothing overflows
  const tileW      = Math.floor(Math.min(tileFromW, tileFromH));
  const tileH      = Math.floor(tileW * TILE_ASPECT);
  const gap        = Math.max(1, Math.floor(tileW * GAP_RATIO));
  const headerFont = Math.max(8, Math.floor(tileW * 0.52));
  const tileFont   = Math.max(6, Math.floor(tileW * 0.60));

  // Push everything through CSS variables — tiles resize automatically
  const root = document.documentElement;
  root.style.setProperty('--tile-w',           tileW      + 'px');
  root.style.setProperty('--tile-h',           tileH      + 'px');
  root.style.setProperty('--tile-font',        tileFont   + 'px');
  root.style.setProperty('--header-font-size', headerFont + 'px');

  // Minimal shell padding — just enough to not clip tile borders
  shell.style.padding = '3px';

  if (grid) {
    grid.style.gap       = gap + 'px';
    grid.style.marginTop = gap + 'px';
  }
}

/* ================================================================
   GRID BUILDER
   ================================================================ */
function buildGrid() {
  const grid = document.getElementById('board-grid');
  grid.style.gridTemplateColumns = `repeat(${CONFIG.COLS}, var(--tile-w, 24px))`;
  tiles = [];

  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const span = document.createElement('span');
      span.textContent = ' ';
      tile.appendChild(span);
      grid.appendChild(tile);
      tiles.push(tile);
    }
  }
}

/* ================================================================
   GOOGLE SHEET LOADER
   ================================================================ */
async function loadQuotes() {
  if (!CONFIG.GOOGLE_SHEET_CSV_URL) {
    quotes = FALLBACK_QUOTES;
    return;
  }
  try {
    setStatus('LOADING...');
    const res = await fetch(CONFIG.GOOGLE_SHEET_CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text   = await res.text();
    const parsed = parseCSV(text);
    const filtered = parsed.filter(row => {
      const active = (row.active || '').trim().toUpperCase();
      return active === '' || active === 'TRUE' || active === '1';
    });
    if (filtered.length === 0) throw new Error('No active quotes');
    quotes = filtered.map(row => ({
      quote:  (row.quote  || '').trim().toUpperCase(),
      author: (row.author || '').trim().toUpperCase(),
    }));
    setStatus('');
  } catch (err) {
    console.warn('Sheet load failed:', err.message, '— using fallback quotes.');
    quotes = FALLBACK_QUOTES;
    setStatus('');
  }
}

function parseCSV(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  if (lines.length < 2) return [];
  const headers = splitCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const vals = splitCSVLine(line);
    const obj  = {};
    headers.forEach((h, i) => { obj[h] = (vals[i]||'').replace(/^"|"$/g,''); });
    return obj;
  });
}

function splitCSVLine(line) {
  const r=[]; let cur='', inQ=false;
  for (const ch of line) {
    if (ch==='"') inQ=!inQ;
    else if (ch===',' && !inQ) { r.push(cur); cur=''; }
    else cur+=ch;
  }
  r.push(cur); return r;
}

/* ================================================================
   QUOTE ORDER — shuffle or sequential
   ================================================================ */
function buildOrder() {
  quoteOrder = quotes.map((_,i) => i);
  if (CONFIG.SHUFFLE) shuffleArray(quoteOrder);
  orderPos = 0;
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function nextQuoteIndex() {
  if (orderPos >= quoteOrder.length) {
    // Reshuffle when we've shown all quotes
    if (CONFIG.SHUFFLE) shuffleArray(quoteOrder);
    orderPos = 0;
  }
  return quoteOrder[orderPos++];
}

/* ================================================================
   QUOTE FORMATTER → 5×30 char grid
   ================================================================ */
function formatQuoteToGrid(quoteObj) {
  const cols = CONFIG.COLS;
  const rows = CONFIG.ROWS;
  const maxCells = rows * cols;

  let text = quoteObj.quote;
  if (quoteObj.author) {
    const attr = '  \u2014 ' + quoteObj.author;
    if ((text + attr).length <= maxCells) text += attr;
  }
  if (text.length > maxCells) text = text.substring(0, maxCells - 1) + '\u2026';

  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const word of words) {
    if (!cur) cur = word;
    else if ((cur + ' ' + word).length <= cols) cur += ' ' + word;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);

  const used    = lines.slice(0, rows);
  const vOffset = Math.floor((rows - used.length) / 2);
  const grid    = Array(rows * cols).fill(' ');

  used.forEach((line, li) => {
    const row = vOffset + li;
    const col = Math.floor((cols - line.length) / 2);
    for (let ci = 0; ci < line.length; ci++) {
      grid[row * cols + col + ci] = line[ci];
    }
  });

  return grid;
}

/* ================================================================
   SHOW NEXT QUOTE
   ================================================================ */
function showNextQuote() {
  if (!quotes.length) return;
  const idx       = nextQuoteIndex();
  const charGrid  = formatQuoteToGrid(quotes[idx]);
  animateBoard(charGrid);
}

/* ================================================================
   FLIP ANIMATION
   ================================================================ */
function animateBoard(targetChars) {
  if (isAnimating) return;
  isAnimating = true;

  tiles.forEach((tile, idx) => {
    const target = targetChars[idx] || ' ';
    setTimeout(() => {
      scrambleTile(tile, target, CONFIG.FLIP_SCRAMBLE_REPS, () => {
        if (idx === tiles.length - 1) isAnimating = false;
      });
    }, idx * CONFIG.STAGGER_MS);
  });
}

function scrambleTile(tile, finalChar, reps, onDone) {
  const span = tile.querySelector('span');
  let remaining = reps;

  function flip() {
    if (remaining === reps) playFlip();
    tile.classList.add('flipping');
    setTimeout(() => {
      tile.classList.remove('flipping');
      if (remaining > 0) {
        span.textContent = SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
        tile.classList.add('active');
        remaining--;
        setTimeout(flip, CONFIG.FLIP_DURATION_MS);
      } else {
        span.textContent = finalChar;
        finalChar.trim() === ''
          ? tile.classList.remove('active')
          : tile.classList.add('active');
        if (onDone) onDone();
      }
    }, CONFIG.FLIP_DURATION_MS / 2);
  }
  flip();
}

/* ================================================================
   ROTATION TIMER
   ================================================================ */
function scheduleNext() {
  const min   = CONFIG.ROTATION_MIN_SECS * 1000;
  const max   = CONFIG.ROTATION_MAX_SECS * 1000;
  const delay = Math.random() * (max - min) + min;
  rotationTimer = setTimeout(() => { showNextQuote(); scheduleNext(); }, delay);
}

/* ================================================================
   SOUND — Rich mechanical split-flap rolling sound
   Three layered Web Audio API layers; no external files needed.
     1. RATTLE ROLL  — noise bursts during scramble (drum spinning)
     2. TICK CLICKS  — thin clicks on every frame (pawl catching cards)
     3. LANDING THUD — low thump + slap when tile settles
   ================================================================ */
function getAudioContext() {
  if (!audioCtx) {
    audioCtx    = new (window.AudioContext || window.webkitAudioContext)();
    _masterComp = audioCtx.createDynamicsCompressor();
    _masterComp.threshold.value = -18;
    _masterComp.knee.value      =   6;
    _masterComp.ratio.value     =   4;
    _masterComp.attack.value    =   0.003;
    _masterComp.release.value   =   0.15;
    _masterComp.connect(audioCtx.destination);
  }
  return audioCtx;
}

function makeNoiseBuffer(ctx, dur) {
  const len  = Math.ceil(ctx.sampleRate * dur);
  const buf  = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function playNoiseBurst(ctx, t, dur, peak, fLo, fHi) {
  const src  = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, dur + 0.01);
  const bpf  = ctx.createBiquadFilter();
  bpf.type   = 'bandpass';
  bpf.frequency.value = (fLo + fHi) / 2;
  bpf.Q.value = 0.8;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(peak, t + dur * 0.1);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bpf); bpf.connect(gain); gain.connect(_masterComp);
  src.start(t); src.stop(t + dur + 0.01);
}

function playClick(ctx, t, freq, gainVal, decay) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type   = 'square';
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.3, t + decay);
  gain.gain.setValueAtTime(gainVal, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  osc.connect(gain); gain.connect(_masterComp);
  osc.start(t); osc.stop(t + decay + 0.005);
}

let lastSoundTime = 0;
function playFlip() {
  if (!soundEnabled) return;
  const now = Date.now();
  if (now - lastSoundTime < 25) return;
  lastSoundTime = now;
  try {
    const ctx  = getAudioContext();
    if (ctx.state === 'suspended') ctx.resume();
    const t0   = ctx.currentTime;
    const roll = (CONFIG.FLIP_SCRAMBLE_REPS * CONFIG.FLIP_DURATION_MS) / 1000;

    // 1. Rattle roll
    const bursts = Math.max(3, Math.floor(CONFIG.FLIP_SCRAMBLE_REPS * 0.7));
    const step   = roll / bursts;
    for (let i = 0; i < bursts; i++) {
      playNoiseBurst(ctx, t0 + i*step, step*1.3,
        0.18 + Math.random()*0.10,
        800  + Math.random()*400,
        2400 + Math.random()*800);
    }

    // 2. Tick clicks
    for (let i = 0; i < CONFIG.FLIP_SCRAMBLE_REPS; i++) {
      playClick(ctx, t0 + (i*CONFIG.FLIP_DURATION_MS)/1000,
        1200 + Math.random()*600, 0.12 + Math.random()*0.06, 0.018);
    }

    // 3. Landing thud
    const land = t0 + roll;
    playClick(ctx, land, 90 + Math.random()*40, 0.28, 0.06);
    playNoiseBurst(ctx, land, 0.035, 0.22, 300, 1800);
    playClick(ctx, land + 0.005, 2200 + Math.random()*800, 0.09, 0.012);

  } catch(e) { /* silently fail */ }
}

/* ================================================================
   SOUND TOGGLE
   ================================================================ */
function setupSoundToggle() {
  const btn = document.getElementById('sound-toggle');
  if (!soundEnabled) btn.classList.add('muted');

  btn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.classList.toggle('muted', !soundEnabled);
    if (soundEnabled) {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();
    }
  });

  // Unlock AudioContext on first click anywhere on the board
  document.getElementById('board-shell').addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });
}

/* ================================================================
   STATUS BAR
   ================================================================ */
function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}
</script>
</body>
</html>
